name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and dev tooling
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Public repository guard
        run: python scripts/check_public_repo.py
      - name: Compile source
        run: python -m compileall -q src
      - name: Import smoke test
        run: python -c "from src.api.app import app; from src.intelligence.pipeline import run_reference_analysis; print(app.title, bool(run_reference_analysis({'symbol':'BNB'})))"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q
      - name: Reference example
        run: python examples/run_reference.py >/tmp/zynost-reference-output.txt && test -s /tmp/zynost-reference-output.txt

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build judge-reproducible image
        run: docker build -t zynost-public-intelligence:ci .
